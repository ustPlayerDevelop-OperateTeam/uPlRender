[package]
name = "ustplayer_renderer"
version = "0.1.0"
edition = "2021"
description = "Rust video renderer for ustPlayer (cdylib)"

[lib]
name = "ustplayer_renderer"
path = "lib/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
fontdue = "0.7"
log = "0.4"
thiserror = "1"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"